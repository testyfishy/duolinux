version: 1
kind: DeviceProfile
name: Duo mouse (left stick points, right stick scrolls)
mapping:
- name: Left stick pointer
  source_event:
    gamepad:
      axis:
        name: LeftStick
  target_events:
  - mouse:
      motion:
        speed_pps: 900
- name: Duo a
  source_event:
    gamepad:
      button: East
  target_events:
  - keyboard: KeyEnter
- name: Duo b
  source_event:
    gamepad:
      button: South
  target_events:
  - keyboard: KeyEsc
- name: Duo dpad_down
  source_event:
    gamepad:
      button: DPadDown
  target_events:
  - keyboard: KeyDown
- name: Duo dpad_left
  source_event:
    gamepad:
      button: DPadLeft
  target_events:
  - keyboard: KeyLeft
- name: Duo dpad_right
  source_event:
    gamepad:
      button: DPadRight
  target_events:
  - keyboard: KeyRight
- name: Duo dpad_up
  source_event:
    gamepad:
      button: DPadUp
  target_events:
  - keyboard: KeyUp
- name: Duo l1
  source_event:
    gamepad:
      button: LeftBumper
  target_events:
  - mouse:
      button: Left
- name: Duo r1
  source_event:
    gamepad:
      button: RightBumper
  target_events:
  - mouse:
      button: Right
- name: Duo select
  source_event:
    gamepad:
      button: Select
  target_events:
  - keyboard: KeyF15
- name: Duo start
  source_event:
    gamepad:
      button: Start
  target_events:
  - keyboard: KeyF14
- name: Duo x
  source_event:
    gamepad:
      button: North
  target_events:
  - keyboard: KeySpace
- name: Duo y
  source_event:
    gamepad:
      button: West
  target_events:
  - keyboard: KeyCompose
- name: Duo right stick scroll
  source_event:
    gamepad:
      axis:
        name: RightStick
  target_events:
  - mouse:
      wheel:
        direction: vertical
        speed: 1200.0
        deadzone: 0.15
