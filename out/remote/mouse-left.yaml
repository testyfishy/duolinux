version: 1
kind: DeviceProfile
name: Duo mouse (left stick points, right stick scrolls)
mapping:
  - name: Left stick pointer
    source_event:
      gamepad:
        axis:
          name: LeftStick
    target_events:
      - mouse:
          motion:
            speed_pps: 900

  - name: Right stick scroll up
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: up
          deadzone: 0.35
    target_events:
      - mouse:
          button: WheelUp
  - name: Right stick scroll down
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: down
          deadzone: 0.35
    target_events:
      - mouse:
          button: WheelDown
  - name: Right stick scroll left
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: left
          deadzone: 0.35
    target_events:
      - mouse:
          button: WheelLeft
  - name: Right stick scroll right
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: right
          deadzone: 0.35
    target_events:
      - mouse:
          button: WheelRight

  - name: L1 left click
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - mouse:
          button: Left
  - name: R1 right click
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - mouse:
          button: Right

  - name: L2 scroll up
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.3
    target_events:
      - mouse:
          button: WheelUp
  - name: R2 scroll down
    source_event:
      gamepad:
        trigger:
          name: RightTrigger
          deadzone: 0.3
    target_events:
      - mouse:
          button: WheelDown
