# DuoLinux defaults. Edit with: nano /etc/duo/duo.conf
# After editing, the cockpit picks changes up within one refresh cycle.

[general]
# seconds between fleet / LLM polls
refresh = 15

[ssh]
# comma-separated ssh destinations: user@host or a Host alias from ~/.ssh/config
hosts = server

[llm]
# host that runs your models (must be reachable by ssh)
host = server
# this command runs on that host; keep it fast and non-interactive
command = echo '== GPU'; (nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader 2>/dev/null || rocm-smi --showuse --showmemuse 2>/dev/null || true); echo '== OLLAMA'; (ollama ps 2>/dev/null || true); echo '== TOP'; ps -eo pcpu,pmem,comm --sort=-pcpu | head -6

[tailscale]
ssh = true
